[package]
name = "claudio"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
crossterm = "0.29"
# Only to read timestamps, so without the time zone database
jiff = { version = "0.2", default-features = false, features = ["std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only the grammars and a regex engine in Rust, since the terminal's own colors replace its themes
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# The file of the full view, removed when the client ends
tempfile = "3"
# Only to read the config file
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[lints.clippy]
pedantic = "warn"
