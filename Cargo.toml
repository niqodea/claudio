[package]
name = "claudio"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "claudio"
path = "src/main.rs"
# The library of the same name has the docs, which this one would overwrite
doc = false

[dependencies]
# Only to read timestamps, so without the time zone database
jiff = { version = "0.2", default-features = false, features = ["std"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# To end on a termination signal only once claudio restored the terminal and removed its files
signal-hook = "0.3"
# To check the Claude Code it installs against its pinned sha256
sha2 = "0.10"
# Only the grammars and a regex engine in Rust, since the terminal's own colors replace its themes
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
# The file of the full view, removed when the client ends
tempfile = "3"
# Reads what the terminal sends, and stops at a terminal that closed, where crossterm 0.29 reads
# on at full CPU: https://github.com/crossterm-rs/crossterm/issues/793
termina = "0.4"
# Only to read the config file
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[lints.clippy]
pedantic = "warn"
